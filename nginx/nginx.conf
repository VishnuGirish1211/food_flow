# Nginx reverse proxy configuration for FoodFlow.
#
# Responsibilities (intentionally limited):
#   - Single public entry point on port 80
#   - Path-based routing to backend services
#
# What this does NOT do (by design):
#   - TLS termination (would add in production with Let's Encrypt / cert-manager)
#   - Load balancing (single instance per service in this project)
#   - Rate limiting (handled by Auth service with Redis)
#   - Caching (not needed for this API-only project)

upstream auth_service {
    server auth-service:8001;
}

upstream order_service {
    server order-service:8002;
}

upstream restaurant_service {
    server restaurant-service:8003;
}

upstream payment_service {
    server payment-service:8004;
}

server {
    listen 80;
    server_name localhost;

    # ── Auth Service ─────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── Order Service ────────────────────────────────────────────
    location /orders/ {
        proxy_pass http://order_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
    # Exact match for /orders (no trailing slash)
    location = /orders {
        proxy_pass http://order_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── Restaurant Service ───────────────────────────────────────
    location /restaurants/ {
        proxy_pass http://restaurant_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
    location = /restaurants {
        proxy_pass http://restaurant_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── Payment Service ──────────────────────────────────────────
    location /payments/ {
        proxy_pass http://payment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
    location = /payments {
        proxy_pass http://payment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
}
